name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Check exposed API
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            --retry-delay 1 http://localhost:4010/health
          curl --fail --silent --show-error http://localhost:3000/health
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request PUT --header 'Content-Type: application/json' \
            --data '{"now":"2027-03-28T08:00:00Z"}' http://localhost:3000/test/clock)
          test "$status" = 204
      - name: Run lint, typecheck and integration tests
        run: docker compose run --rm --build checks
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down
